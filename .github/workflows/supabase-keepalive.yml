name: Supabase keep-alive

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin actividad.
# Esta tarea hace una consulta mínima cada 3 días para mantenerlo activo.

on:
  schedule:
    - cron: "0 12 */3 * *" # cada 3 días, 7:00 a. m. hora Colombia
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consultar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Llama a la función public.keepalive(), que solo devuelve 1 y no expone ningún dato.
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Respuesta de Supabase: $status"
          if [ "$status" -ge 400 ]; then exit 1; fi
